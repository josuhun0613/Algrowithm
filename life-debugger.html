    <style>
        * {

        body {

<body class="antialiased">
    <div id="app"></div>

    <script>
        // ============== Constants ==============
        const SYSTEM_PROMPT = `당신은 '5 Why 분석 기법' 전문가입니다. 사용자의 문제에서 근본 원인(Root Cause)을 찾아내는 것이 목표입니다.

**[5 Why 기법의 핵심 원칙]**
문제 → 왜? → 원인1 → 왜? → 원인2 → 왜? → 원인3 → 왜? → 원인4 → 왜? → **근본 원인**

**[질문 전략 - 매우 중요]**

1. **대처 가능한 원인일 때**: "왜"로만 꼬리질문을 이어갑니다.
   - 예: "나오고 싶지 않다" → "왜 나오고 싶지 않으세요?"
   - 예: "재미가 없다" → "왜 재미가 없다고 느끼세요?"

2. **대처 불가능한 원인일 때**: "왜"로 묻지 말고, 그 원인을 인정한 채 **결과부에 대해** 질문합니다.
   - 예: "돈이 없어서" → (X) "왜 돈이 없으세요?"
   - 예: "돈이 없어서" → (O) "돈이 없는 상황에서도 하고 싶은 마음은 있으신 건가요? 아니면 돈 외에 다른 이유도 있으신가요?"
   - 예: "시간이 없어서" → (O) "시간이 부족한 건 어쩔 수 없다 치고, 만약 시간이 있다면 하고 싶으세요?"
   - 예: "형편이 어려워서" → (O) "형편이 어려운 건 현실이니까요. 그렇다면 형편이 어렵더라도 방법이 있다면 해보고 싶은 마음이 있으신가요?"

3. **대처 불가능한 원인 판별 기준**:
   - 경제적 상황 (돈이 없다, 형편이 어렵다)
   - 물리적 제약 (거리가 멀다, 시간이 없다)
   - 타인의 행동/태도 (상대방이 안 한다, 부모님이 반대한다)
   - 과거 사건 (이미 일어난 일)

   → 이런 답변이 나오면 "왜 그런가요?"라고 묻지 말고, **그 상황을 인정하면서** 사용자의 진짜 의지나 다른 원인을 탐색하세요.

**[진행 규칙]**
1. 질문은 총 5단계로 진행됩니다.
2. 매 질문마다 위의 전략을 적용하여 "대처 가능한 원인"인지 "대처 불가능한 원인"인지 판단하세요.
3. 5번째 질문 전까지는 조언이나 해결책을 주지 마세요.
4. 응답은 2-3문장으로 간결하게: 공감 한 문장 + 질문 한 문장

**[중요]**
- 반드시 한국어로 응답하세요.
- 질문은 하나만 던지세요.
- "왜 돈이 없어요?", "왜 시간이 없어요?" 같은 무의미한 질문은 절대 하지 마세요.`;

        const SUMMARY_PROMPT = `지금까지의 5 Why 분석 대화를 바탕으로 결과를 요약해주세요.

**[원인 뒤집기 적용]**
- 발견된 근본 원인이 "대처 불가능한 원인"이라면: 그 원인을 유지한 채, 결과만 바꾸는 방향으로 insight를 작성
  - 예: 원인 "형편이 어려워서" → insight "형편이 어렵더라도, 작은 것부터 시작해볼 수 있어요"
- 발견된 근본 원인이 "대처 가능한 원인"이라면: 그 원인 자체를 바꾸는 방향으로 insight를 작성
  - 예: 원인 "재미있는 요소가 없어서" → insight "재미있는 요소를 만들어보는 건 어떨까요?"

반드시 아래 JSON 형식으로만 응답하세요:

{
  "surfaceProblem": "사용자가 처음 제시한 표면적인 문제를 한 문장으로",
  "rootCause": "5 Why를 통해 발견된 근본 원인을 명확하게 1-2문장으로",
  "insight": "원인 뒤집기를 적용한 실천 가능한 방향 제시 2-3문장으로"
}`;

        const TIPS = [
            "솔직하게 적을수록 진짜 원인을 찾을 수 있어요",
            "처음 떠오르는 생각을 그대로 적어보세요",
            "정답은 없어요. 당신의 진심이 중요합니다",
            "불편한 감정도 괜찮아요. 그것이 실마리가 됩니다",
            "천천히 생각해도 괜찮아요. 시간을 드릴게요",
            "머릿속에 떠오르는 장면이 있다면 설명해주세요",
            "감정에 이름을 붙여본다면 무엇일까요?",
            "그 순간 당신은 무엇을 원했나요?",
        ];

        const LOADING_MESSAGES = [
            "당신의 마음을 깊이 들여다보는 중...",
            "이야기의 실마리를 찾고 있어요...",
            "당신의 감정을 천천히 읽고 있어요...",
            "숨겨진 의미를 발견하는 중...",
            "마음의 지도를 그리는 중...",
        ];

        // Gemini API 키
        const GEMINI_API_KEY = 'AIzaSyDD6LArssYHvciL9bzixz9wG2WYEDWTMHs';

        // ============== State Management ==============
        let state = {
            screen: 'welcome', // 'welcome', 'chat', 'result'
            messages: [],
            turnCount: 0,
            isLoading: false,
            result: null,
            initialConcern: '',
            currentTip: TIPS[Math.floor(Math.random() * TIPS.length)],
            loadingMessage: LOADING_MESSAGES[0],
        };

        // ============== Utility Functions ==============
        function generateId() {
            return Math.random().toString(36).substring(2, 9);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============== API Functions ==============
        async function callGeminiAPI(messages, turnCount, shouldSummarize, initialConcern) {
            let prompt;

            if (shouldSummarize) {
                prompt = `${SYSTEM_PROMPT}

지금까지의 대화:
${messages.map(m => `${m.role === 'user' ? '사용자' : 'AI'}: ${m.content}`).join('\n')}

${SUMMARY_PROMPT}`;
            } else {
                const systemMessage = `${SYSTEM_PROMPT}

현재 진행 단계: ${turnCount}/5
${turnCount === 1 ? '이것이 사용자의 첫 번째 고민입니다. 공감하고 첫 번째 Why 질문을 던지세요.' : ''}
${turnCount === 5 ? '이것이 마지막 질문입니다. 가장 깊은 수준의 질문을 던지세요.' : ''}

지금까지의 대화:
${messages.map(m => `${m.role === 'user' ? '사용자' : 'AI'}: ${m.content}`).join('\n')}

위 대화를 이어서 다음 질문을 해주세요.`;
                prompt = systemMessage;
            }

            const response = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}`,
                {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: {
                            temperature: shouldSummarize ? 0.7 : 0.8,
                            maxOutputTokens: shouldSummarize ? 1000 : 500,
                        },
                    }),
                }
            );

            if (!response.ok) {
                throw new Error('API 요청 실패');
            }

            const data = await response.json();
            const responseText = data.candidates?.[0]?.content?.parts?.[0]?.text || '';

            if (shouldSummarize) {
                try {
                    const jsonMatch = responseText.match(/\{[\s\S]*\}/);
                    if (jsonMatch) {
                        const result = JSON.parse(jsonMatch[0]);
                        return {
                            type: 'result',
                            result: {
                                surfaceProblem: result.surfaceProblem || initialConcern,
                                rootCause: result.rootCause || '분석 결과를 생성하지 못했습니다.',
                                insight: result.insight || '',
                            }
                        };
                    }
                } catch (e) {
                    console.error('JSON parse error:', e);
                }
                return {
                    type: 'result',
                    result: {
                        surfaceProblem: initialConcern,
                        rootCause: responseText || '분석 결과를 생성하지 못했습니다.',
                        insight: '당신의 고민을 깊이 들여다봐 주셔서 감사합니다.',
                    }
                };
            }

            return { type: 'message', message: responseText };
        }

        // ============== Event Handlers ==============
        async function handleSendMessage(content) {
            if (!content.trim() || state.isLoading) return;

            const userMessage = {
                id: generateId(),
                role: 'user',
                content: content.trim(),
            };

            const isFirstMessage = state.messages.length === 0;
            const newTurnCount = state.turnCount + 1;

            state.messages.push(userMessage);
            state.turnCount = newTurnCount;
            state.isLoading = true;
            if (isFirstMessage) state.initialConcern = content.trim();
            state.currentTip = TIPS[Math.floor(Math.random() * TIPS.length)];

            render();
            scrollToBottom();

            // 로딩 메시지 변경
            const loadingInterval = setInterval(() => {
                state.loadingMessage = LOADING_MESSAGES[Math.floor(Math.random() * LOADING_MESSAGES.length)];
                render();
            }, 3000);

            try {
                const shouldSummarize = newTurnCount >= 5;
                const response = await callGeminiAPI(
                    state.messages,
                    newTurnCount,
                    shouldSummarize,
                    state.initialConcern
                );

                clearInterval(loadingInterval);

                if (response.type === 'result') {
                    state.result = response.result;
                    state.isLoading = false;
                    state.screen = 'result';

                    // 로컬 스토리지에 저장
                    localStorage.setItem('lifeDebuggerResult', JSON.stringify({
                        ...response.result,
                        savedAt: new Date().toISOString(),
                    }));
                } else {
                    const assistantMessage = {
                        id: generateId(),
                        role: 'assistant',
                        content: response.message,
                    };
                    state.messages.push(assistantMessage);
                    state.isLoading = false;
                }

                render();
                scrollToBottom();

            } catch (error) {
                clearInterval(loadingInterval);
                console.error('Error:', error);
                state.isLoading = false;
                alert('오류가 발생했습니다. 다시 시도해주세요.');
                render();
            }
        }

        function handleReset() {
            state = {
                screen: 'welcome',
                messages: [],
                turnCount: 0,
                isLoading: false,
                result: null,
                initialConcern: '',
                currentTip: TIPS[Math.floor(Math.random() * TIPS.length)],
                loadingMessage: LOADING_MESSAGES[0],
            };
            render();
        }

        function handleStart() {
            state.screen = 'chat';
            render();
        }

        function scrollToBottom() {
            setTimeout(() => {
                const chatArea = document.getElementById('chatArea');
                if (chatArea) {
                    chatArea.scrollTop = chatArea.scrollHeight;
                }
            }, 100);
        }

        async function handleShare() {
            const text = `🔍 5 Why 분석 결과\n\n📌 표면적 고민: ${state.result.surfaceProblem}\n\n🌱 진짜 원인: ${state.result.rootCause}\n\n💡 통찰: ${state.result.insight}`;

            if (navigator.share) {
                try {
                    await navigator.share({ text });
                } catch (err) {}
            } else {
                navigator.clipboard.writeText(text);
                alert('결과가 클립보드에 복사되었습니다.');
            }
        }

        // ============== Render Functions ==============
        function renderWelcomeScreen() {
            return `
                <div class="min-h-screen flex flex-col items-center justify-center p-6">
                    <!-- Logo -->
                    <div class="relative mb-8">
                        <div class="w-24 h-24 rounded-full bg-gradient-to-r from-aurora-purple to-aurora-cyan flex items-center justify-center animate-float">
                            <i data-lucide="brain" class="w-12 h-12 text-white"></i>
                        </div>
                        <div class="absolute -bottom-2 -right-2 w-8 h-8 rounded-full bg-aurora-cyan flex items-center justify-center">
                            <i data-lucide="sparkles" class="w-4 h-4 text-midnight-900"></i>
                        </div>
                    </div>

                    <!-- Title -->
                    <h1 class="text-4xl font-bold gradient-text mb-4 text-center">라이프 디버거</h1>
                    <p class="text-xl text-midnight-300 mb-2 text-center">5 Why 심층 분석</p>
                    <p class="text-midnight-500 text-center max-w-md mb-12">
                        표면적인 고민 뒤에 숨겨진 진짜 원인을 찾아드립니다.<br>
                        5번의 깊은 대화로 당신의 마음을 들여다보세요.
                    </p>

                    <!-- Features -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 max-w-2xl mb-12">
                        <div class="glass rounded-xl p-4 text-center">
                            <i data-lucide="message-circle" class="w-8 h-8 text-aurora-purple mx-auto mb-2"></i>
                            <h3 class="text-sm font-medium text-white mb-1">깊은 대화</h3>
                            <p class="text-xs text-midnight-400">5번의 질문으로 핵심에 도달</p>
                        </div>
                        <div class="glass rounded-xl p-4 text-center">
                            <i data-lucide="target" class="w-8 h-8 text-aurora-blue mx-auto mb-2"></i>
                            <h3 class="text-sm font-medium text-white mb-1">근본 원인</h3>
                            <p class="text-xs text-midnight-400">숨겨진 진짜 원인 발견</p>
                        </div>
                        <div class="glass rounded-xl p-4 text-center">
                            <i data-lucide="sparkles" class="w-8 h-8 text-aurora-cyan mx-auto mb-2"></i>
                            <h3 class="text-sm font-medium text-white mb-1">통찰 리포트</h3>
                            <p class="text-xs text-midnight-400">명확한 분석 결과 제공</p>
                        </div>
                    </div>

                    <!-- CTA -->
                    <button onclick="handleStart()"
                        class="group relative px-8 py-4 rounded-2xl bg-gradient-to-r from-aurora-purple to-aurora-blue text-white font-medium text-lg transition-all duration-300 hover:shadow-lg hover:shadow-aurora-purple/30 hover:scale-105">
                        <span class="relative z-10">심층 분석 시작하기</span>
                    </button>

                    <p class="text-xs text-midnight-600 mt-6">약 5-10분 소요 | 모든 대화는 비공개로 진행됩니다</p>

                    <!-- Back to main -->
                    <a href="index.html" class="mt-8 text-midnight-500 hover:text-midnight-300 text-sm flex items-center gap-2 transition-colors">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i>
                        메인으로 돌아가기
                    </a>
                </div>
            `;
        }

        function renderProgressBar() {
            const progress = Math.min((state.turnCount / 5) * 100, 100);
            return `
                <div class="w-full max-w-2xl mx-auto mb-6">
                    <div class="flex items-center justify-between mb-2">
                        <div class="flex items-center gap-2">
                            <i data-lucide="brain" class="w-5 h-5 text-aurora-purple"></i>
                            <span class="text-sm text-midnight-300">심층 분석 진행률</span>
                        </div>
                        <span class="text-sm font-medium text-aurora-purple">${state.turnCount} / 5</span>
                    </div>
                    <div class="h-2 bg-midnight-800 rounded-full overflow-hidden">
                        <div class="h-full bg-gradient-to-r from-aurora-purple to-aurora-cyan transition-all duration-500 ease-out" style="width: ${progress}%"></div>
                    </div>
                    <div class="flex justify-between mt-2">
                        ${[1,2,3,4,5].map(i => `
                            <div class="flex flex-col items-center ${i <= state.turnCount ? 'text-aurora-purple' : 'text-midnight-600'}">
                                <div class="w-3 h-3 rounded-full transition-all duration-300 ${i <= state.turnCount ? 'bg-aurora-purple shadow-lg shadow-aurora-purple/30' : 'bg-midnight-700'}"></div>
                                <span class="text-xs mt-1">Q${i}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderMessage(msg) {
            const isUser = msg.role === 'user';
            return `
                <div class="flex gap-3 ${isUser ? 'flex-row-reverse' : 'flex-row'} fade-in">
                    <div class="flex-shrink-0 w-10 h-10 rounded-full flex items-center justify-center ${isUser ? 'bg-aurora-blue/20 text-aurora-blue' : 'bg-aurora-purple/20 text-aurora-purple'}">
                        <i data-lucide="${isUser ? 'user' : 'sparkles'}" class="w-5 h-5"></i>
                    </div>
                    <div class="max-w-[80%] px-4 py-3 rounded-2xl ${isUser ? 'bg-aurora-blue/20 text-white rounded-tr-sm' : 'bg-midnight-800/80 text-midnight-100 rounded-tl-sm border border-midnight-700'}">
                        <p class="text-sm leading-relaxed whitespace-pre-wrap">${escapeHtml(msg.content)}</p>
                    </div>
                </div>
            `;
        }

        function renderTypingIndicator() {
            return `
                <div class="flex gap-3 fade-in">
                    <div class="flex-shrink-0 w-10 h-10 rounded-full flex items-center justify-center bg-aurora-purple/20 text-aurora-purple">
                        <i data-lucide="sparkles" class="w-5 h-5 animate-pulse"></i>
                    </div>
                    <div class="bg-midnight-800/80 border border-midnight-700 rounded-2xl rounded-tl-sm px-4 py-3">
                        <p class="text-sm text-aurora-purple/80 mb-2 italic">${state.loadingMessage}</p>
                        <div class="flex gap-1">
                            <span class="typing-dot w-2 h-2 bg-aurora-purple rounded-full"></span>
                            <span class="typing-dot w-2 h-2 bg-aurora-purple rounded-full"></span>
                            <span class="typing-dot w-2 h-2 bg-aurora-purple rounded-full"></span>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderChatScreen() {
            return `
                <main class="min-h-screen flex flex-col">
                    <!-- Header -->
                    <header class="sticky top-0 z-10 bg-gradient-to-b from-midnight-900 to-transparent pb-4 pt-6 px-6">
                        <div class="max-w-4xl mx-auto">
                            <div class="flex items-center justify-between mb-4">
                                <button onclick="handleReset()" class="flex items-center gap-2 text-midnight-400 hover:text-white transition-colors">
                                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                                    <span>나가기</span>
                                </button>
                                <div class="flex items-center gap-2 text-midnight-500">
                                    <i data-lucide="moon" class="w-5 h-5"></i>
                                    <span class="text-sm">심야의 상담소</span>
                                </div>
                            </div>
                            ${renderProgressBar()}
                        </div>
                    </header>

                    <!-- Chat Area -->
                    <div id="chatArea" class="flex-1 overflow-y-auto px-6 pb-4 hide-scrollbar">
                        <div class="max-w-2xl mx-auto space-y-6">
                            ${state.messages.length === 0 && !state.isLoading ? `
                                <div class="text-center py-12">
                                    <p class="text-midnight-400 text-lg mb-2">어떤 고민이 있으신가요?</p>
                                    <p class="text-midnight-600 text-sm">마음 속 이야기를 편하게 나눠주세요</p>
                                </div>
                            ` : ''}
                            ${state.messages.map(msg => renderMessage(msg)).join('')}
                            ${state.isLoading ? renderTypingIndicator() : ''}
                        </div>
                    </div>

                    <!-- Input Area -->
                    <div class="sticky bottom-0 bg-gradient-to-t from-midnight-900 via-midnight-900 to-transparent pt-4 pb-6 px-6">
                        <div class="max-w-2xl mx-auto">
                            <!-- Tip -->
                            <div class="flex items-center gap-2 mb-3 px-2">
                                <i data-lucide="lightbulb" class="w-4 h-4 text-aurora-cyan/60"></i>
                                <p class="text-xs text-midnight-400 italic">${state.currentTip}</p>
                            </div>

                            <!-- Input -->
                            <div class="glass rounded-2xl p-2 flex items-end gap-2">
                                <textarea id="messageInput"
                                    placeholder="${state.messages.length === 0 ? '고민을 적어주세요...' : '생각을 이어서 적어주세요...'}"
                                    rows="1"
                                    ${state.isLoading ? 'disabled' : ''}
                                    class="flex-1 bg-transparent text-white placeholder-midnight-500 px-4 py-3 resize-none focus:outline-none text-sm leading-relaxed disabled:opacity-50"
                                    onkeydown="handleKeyDown(event)"
                                    oninput="autoResize(this)"
                                ></textarea>
                                <button onclick="sendFromInput()"
                                    ${state.isLoading ? 'disabled' : ''}
                                    class="flex-shrink-0 w-12 h-12 rounded-xl bg-gradient-to-r from-aurora-purple to-aurora-blue flex items-center justify-center text-white transition-all duration-200 hover:opacity-90 disabled:opacity-30 disabled:cursor-not-allowed">
                                    <i data-lucide="send" class="w-5 h-5"></i>
                                </button>
                            </div>
                            <p class="text-xs text-midnight-600 text-center mt-2">Shift + Enter로 줄바꿈 | Enter로 전송</p>
                        </div>
                    </div>
                </main>
            `;
        }

        function renderResultScreen() {
            return `
                <main class="min-h-screen p-6">
                    <div class="max-w-4xl mx-auto">
                        <!-- Header -->
                        <header class="flex items-center justify-between mb-8">
                            <button onclick="handleReset()" class="flex items-center gap-2 text-midnight-400 hover:text-white transition-colors">
                                <i data-lucide="arrow-left" class="w-5 h-5"></i>
                                <span>처음으로</span>
                            </button>
                            <div class="flex items-center gap-2 text-midnight-500">
                                <i data-lucide="moon" class="w-5 h-5"></i>
                                <span class="text-sm">심야의 상담소</span>
                            </div>
                        </header>

                        <!-- Result Card -->
                        <div class="w-full max-w-2xl mx-auto fade-in">
                            <!-- Header -->
                            <div class="text-center mb-8">
                                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gradient-to-r from-aurora-purple to-aurora-cyan mb-4">
                                    <i data-lucide="target" class="w-8 h-8 text-white"></i>
                                </div>
                                <h2 class="text-2xl font-bold gradient-text mb-2">분석이 완료되었습니다</h2>
                                <p class="text-midnight-400">당신의 고민을 깊이 들여다본 결과입니다</p>
                            </div>

                            <!-- Result Cards -->
                            <div class="space-y-4">
                                <!-- Surface Problem -->
                                <div class="glass rounded-2xl p-6 transition-all duration-300 hover:border-aurora-blue/30">
                                    <div class="flex items-start gap-4">
                                        <div class="flex-shrink-0 w-12 h-12 rounded-xl bg-aurora-blue/20 flex items-center justify-center">
                                            <i data-lucide="heart" class="w-6 h-6 text-aurora-blue"></i>
                                        </div>
                                        <div>
                                            <h3 class="text-sm font-medium text-aurora-blue mb-2">🌊 껍질 (표면적 고민)</h3>
                                            <p class="text-midnight-200 leading-relaxed">${escapeHtml(state.result.surfaceProblem)}</p>
                                        </div>
                                    </div>
                                </div>

                                <!-- Root Cause -->
                                <div class="glass rounded-2xl p-6 border-aurora-purple/30 transition-all duration-300 hover:border-aurora-purple/50">
                                    <div class="flex items-start gap-4">
                                        <div class="flex-shrink-0 w-12 h-12 rounded-xl bg-aurora-purple/20 flex items-center justify-center">
                                            <i data-lucide="target" class="w-6 h-6 text-aurora-purple"></i>
                                        </div>
                                        <div>
                                            <h3 class="text-sm font-medium text-aurora-purple mb-2">🌱 뿌리 (진짜 원인)</h3>
                                            <p class="text-white leading-relaxed font-medium">${escapeHtml(state.result.rootCause)}</p>
                                        </div>
                                    </div>
                                </div>

                                <!-- Insight -->
                                <div class="glass rounded-2xl p-6 transition-all duration-300 hover:border-aurora-cyan/30">
                                    <div class="flex items-start gap-4">
                                        <div class="flex-shrink-0 w-12 h-12 rounded-xl bg-aurora-cyan/20 flex items-center justify-center">
                                            <i data-lucide="lightbulb" class="w-6 h-6 text-aurora-cyan"></i>
                                        </div>
                                        <div>
                                            <h3 class="text-sm font-medium text-aurora-cyan mb-2">💫 통찰</h3>
                                            <p class="text-midnight-200 leading-relaxed italic">${escapeHtml(state.result.insight)}</p>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Actions -->
                            <div class="flex justify-center gap-4 mt-8">
                                <button onclick="handleReset()" class="flex items-center gap-2 px-6 py-3 rounded-xl bg-midnight-800 text-midnight-300 hover:bg-midnight-700 hover:text-white transition-all duration-200">
                                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                                    <span>새로운 분석</span>
                                </button>
                                <button onclick="handleShare()" class="flex items-center gap-2 px-6 py-3 rounded-xl bg-gradient-to-r from-aurora-purple to-aurora-blue text-white hover:opacity-90 transition-all duration-200">
                                    <i data-lucide="share-2" class="w-4 h-4"></i>
                                    <span>결과 공유</span>
                                </button>
                            </div>

                            <p class="text-center text-xs text-midnight-600 mt-6">이 결과는 로컬에 저장되었습니다.</p>

                            <!-- Back to main -->
                            <div class="text-center mt-8">
                                <a href="index.html" class="text-midnight-500 hover:text-midnight-300 text-sm flex items-center gap-2 justify-center transition-colors">
                                    <i data-lucide="home" class="w-4 h-4"></i>
                                    메인으로 돌아가기
                                </a>
                            </div>
                        </div>
                    </div>
                </main>
            `;
        }

        function render() {
            const app = document.getElementById('app');

            if (state.screen === 'welcome') {
                app.innerHTML = renderWelcomeScreen();
            } else if (state.screen === 'chat') {
                app.innerHTML = renderChatScreen();
            } else if (state.screen === 'result') {
                app.innerHTML = renderResultScreen();
            }

            // Lucide 아이콘 초기화
            lucide.createIcons();
        }

        // ============== Input Handlers ==============
        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendFromInput();
            }
        }

        function sendFromInput() {
            const input = document.getElementById('messageInput');
            if (input && input.value.trim()) {
                handleSendMessage(input.value);
                input.value = '';
                input.style.height = 'auto';
            }
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 150) + 'px';
        }

        // ============== Initialize ==============
        document.addEventListener('DOMContentLoaded', () => {
            render();
        });
    </script>
</body>

</html>
